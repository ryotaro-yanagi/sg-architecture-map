<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      (() => {
        let appearance = 'system'
        try { appearance = localStorage.getItem('sgm-appearance') || 'system' } catch {}
        const night = appearance === 'night' || (appearance === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.appearance = night ? 'night' : 'day'
        document.querySelector('meta[name="theme-color"]').content = night ? '#1B211F' : '#fafafa'
      })()
    </script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { background: #fafafa; }
      html[data-appearance='night'] body { background: #1B211F; }
      .initial-page-loading { position: fixed; inset: 0; display: grid; place-content: center; padding: 24px; color: #212121; background: #fafafa; font: 500 18px/1.35 'Source Sans 3', 'Hiragino Sans', 'Yu Gothic', system-ui, -apple-system, sans-serif; text-align: center; }
      .initial-page-loading .loading-title { margin: 0; animation: sgm-loading-breathe 800ms ease-in-out infinite; }
      html[data-appearance='night'] .initial-page-loading { color: #F2F4F0; background: #1B211F; }
      @keyframes sgm-loading-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { .initial-page-loading .loading-title { animation: none; opacity: 1; } }
    </style>
    <meta name="description" content="シンガポールの建築を地図から発見する、SG Architecture Mapの試作版。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:wght@360..400&amp;family=LINE+Seed+JP:wght@400;700&amp;family=BIZ+UDPMincho:wght@400&amp;display=swap" />
    <style>
      @font-face {
        font-family: 'SGM Han Sans JP';
        src: url('../fonts/sgm-han-sans-jp.woff2') format('woff2');
        font-style: normal;
        font-weight: 200 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'SGM Han Serif JP';
        src: url('../fonts/sgm-han-serif-jp.woff2') format('woff2');
        font-style: normal;
        font-weight: 200 900;
        font-display: swap;
      }
    </style>
    <link rel="icon" href="../favicon-v2.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <title>Singapore Architecture Map</title>
  </head>
  <body>
    <div id="root"><div class="initial-page-loading" role="status"><p class="loading-title">Singapore Architecture Map</p></div></div>
    <script>
      (() => {
        const title = document.querySelector('.initial-page-loading .loading-title')
        if (title) title.style.animationDelay = `-${performance.now() % 800}ms`
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
